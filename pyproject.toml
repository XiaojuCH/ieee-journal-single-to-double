[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ieee-paper-doctor"
version = "1.1.0"
description = "Audit, conservatively fix, and verify IEEEtran two-column manuscripts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "XiaojuCH" }
]
keywords = ["IEEEtran", "LaTeX", "two-column", "academic-writing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: LaTeX"
]

[project.urls]
Homepage = "https://github.com/XiaojuCH/ieee-journal-single-to-double"
Repository = "https://github.com/XiaojuCH/ieee-journal-single-to-double"
Issues = "https://github.com/XiaojuCH/ieee-journal-single-to-double/issues"

[project.scripts]
ieee-paper-doctor = "ieee_paper_doctor:main"

[tool.setuptools]
py-modules = ["ieee_paper_doctor"]
package-dir = { "" = "skills/ieee-paper-doctor/scripts" }
